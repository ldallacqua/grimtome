[package]
name = "d4data"
description = "Read-only, offline access to a locally installed Diablo IV's UI textures and text, for Grimtome's optional asset importer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "grimtome-extract"
path = "src/bin/grimtome-extract.rs"

[dependencies]
flate2 = "1"
texture2ddecoder = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
