[package]
name = "grimtome"
description = "Grimtome desktop host: capture, OCR, overlay, hotkeys and the local asset importer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "grimtome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "grimtome"
path = "src/main.rs"

[[bin]]
name = "grimtome-ocr"
path = "src/bin/grimtome-ocr.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
regex = "1"
d4data = { path = "../crates/d4data" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_System_WinRT",
] }
windows-future = "0.2"
