name: Release

# Builds the Windows installers for a version tag and attaches them to a draft
# GitHub release. Installers are unsigned (no code-signing certificate is
# configured); see docs/RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:assets
      - run: pnpm test
      - run: pnpm app:build
      - name: Portable build and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item target/release/grimtome.exe "grimtome-$version-portable.exe"
          $files = Get-ChildItem target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi, grimtome-*-portable.exe
          $files | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag --draft --title "Grimtome $tag" --notes-file docs/RELEASE_NOTES.md `
            (Get-ChildItem target/release/bundle/nsis/*.exe).FullName `
            (Get-ChildItem target/release/bundle/msi/*.msi).FullName `
            (Get-ChildItem grimtome-*-portable.exe).FullName `
            SHA256SUMS.txt
